<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --baby:#DEECFC; --earth:#45535A; --slate:#4E616A; --peacock:#2F9BFF; --paper:#FBFCFD;
  --goose:#F5F5C1; --line:#CCCCCC; --snow-a:#F2F9FF; --snow-b:#ECF1F6;
  --gold-a:#FDFF9E; --gold-b:rgba(227,255,54,.86);
  --stage:#C9DDF3; --stage-ink:#45535A;
  --round:"SF Compact Rounded","SF Pro Rounded",ui-rounded,"Nunito",system-ui,sans-serif;
  --btn:"SF Pro Rounded",ui-rounded,"Nunito",system-ui,sans-serif;
  --han:"Hiragino Kaku Gothic Pro","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --stage:#1B2530; --stage-ink:#DEECFC; } }
:root[data-theme="dark"]{ --stage:#1B2530; --stage-ink:#DEECFC; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--stage);font-family:var(--round);color:var(--earth);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%}
#phone{position:absolute;left:50%;top:50%;width:375px;height:812px;transform-origin:center;overflow:hidden;background:var(--baby);border-radius:28px;box-shadow:0 20px 60px rgba(20,40,70,.25)}
@media (max-width:500px){ #phone{border-radius:0;box-shadow:none} }
.scr{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--peacock);outline-offset:2px;border-radius:8px}
.h1{font-weight:700;font-size:26px;line-height:1;text-align:center;color:var(--earth)}
.h4{font-weight:600;font-size:20px;line-height:1;text-align:center}
.body18{font-size:18px;line-height:1.2;text-align:center}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;height:42px;width:158px;border-radius:100px;background:var(--earth);color:#fff;font-family:var(--btn);font-weight:600;font-size:22px;white-space:nowrap}
.pill:active{transform:scale(.97)}
.pill.sm{height:38px}
.bub{position:absolute}
.bub svg{position:absolute;left:-19.2%;top:-19.2%;width:138.4%;height:138.4%;overflow:visible}
button.bub{border-radius:50%}
.tlabel{position:absolute;width:60px;text-align:center;font-weight:700;font-size:16px;color:var(--earth)}
/* menu */
.menu{position:absolute;left:0;top:719px;width:376px;height:93px;display:flex;align-items:flex-end}
.tab{position:relative;width:94px;height:76px;background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.tab.on{height:93px;background:none;padding-top:27px}
.tab.on .bump{position:absolute;inset:0}
.tab .ic{position:relative;width:24px;height:24px;border-radius:4px}
.tab.on .ic{background:linear-gradient(var(--gold-a),var(--gold-b))}
.tab span{position:relative;font-weight:500;font-size:18px;line-height:36px;color:var(--earth)}
/* training */
.progress{position:absolute;width:200px;height:20px;border-radius:12px;overflow:hidden;background:var(--paper);display:flex}
.progress i{width:20px;height:20px;background:linear-gradient(var(--snow-a),var(--snow-b));transition:background .3s}
.progress i.f{background:var(--earth)}
.iconbtn{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.card{position:absolute;width:220px;height:220px;perspective:900px}
.card .in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;display:flex;flex-direction:column;align-items:center}
.face.back{transform:rotateY(180deg);background:#F1F7FD;justify-content:center}
.han{font-family:var(--han);color:var(--earth);font-weight:300;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--earth);color:var(--paper);border-radius:4.7px;padding:6px 10px;font-weight:700;font-size:22px}
.chip.ghost{background:rgba(69,83,90,.2)}
.corner{position:absolute;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.pic{font-size:92px;line-height:1;margin-bottom:10px}
.tonelines{position:absolute;width:334px;height:272px}
.tonelines text{font-family:var(--round);font-size:14px;fill:var(--earth)}
.feedback{position:absolute;left:0;width:375px;text-align:center}
.speak{position:absolute;width:80px;height:80px;border-radius:50%;background:linear-gradient(#689DB7,#45535A);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(69,83,90,.3)}
.speak.rec{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,155,255,.5)}50%{box-shadow:0 0 0 16px rgba(47,155,255,0)}}
.hint{position:absolute;left:24px;right:24px;text-align:center;font-size:14px;line-height:1.35;color:var(--slate)}
/* poof + celebrate */
.poof i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9fd4ff 45%,#5aa9ff);animation:poof .9s ease-out forwards}
@keyframes poof{0%{transform:translate(0,0) scale(.2);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.hop{animation:hop .7s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
.gjcard{position:absolute;left:94px;top:138px;width:188px;height:188px;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
/* teachers + chat */
.hdr{position:absolute;left:0;top:0;width:375px;height:108px;background:var(--peacock)}
.hdr.snow{background:linear-gradient(var(--snow-a),var(--snow-b))}
.row{display:flex;gap:16px;align-items:center;padding:16px;width:375px;height:106px;background:linear-gradient(var(--snow-a),var(--snow-b));border-bottom:1px solid var(--line);text-align:left}
.ava{position:relative;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;border:1.5px solid #fff}
.ava .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--peacock);border:1.5px solid #fff}
.ava .dot.off{background:#B7C3CA}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--peacock);color:var(--paper);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
#msgs{position:absolute;left:0;top:108px;width:375px;bottom:86px;overflow-y:auto;padding:28px 10px 16px;display:flex;flex-direction:column;gap:16px;background:#fff}
.me{align-self:flex-end;max-width:250px;background:var(--peacock);color:#fff;font-size:14px;line-height:1.35;padding:11px 16px;border-radius:18px 18px 4px 18px}
.them{display:flex;gap:12px;align-items:flex-end;max-width:320px}
.them p{margin:0;background:linear-gradient(var(--snow-a),var(--snow-b));color:#000;font-size:14px;line-height:1.4;padding:11px 16px;border-radius:18px 18px 18px 4px;white-space:pre-wrap}
.typebar{position:absolute;left:0;bottom:0;width:375px;height:86px;background:var(--peacock);display:flex;align-items:center;gap:12px;padding:0 20px}
.typebar input{flex:1;height:38px;border-radius:30px;border:0;padding:0 16px;font:15px var(--round);color:var(--earth);min-width:0}
.typebar input:disabled{background:#dfeaf5}
.typing{opacity:.6}
/* dashboard */
.summary{position:absolute;left:28px;top:132px;width:320px;height:276px;background:var(--paper);border-radius:12px;box-shadow:0 6px 24px rgba(69,83,90,.10);display:flex;flex-direction:column;align-items:center;padding:16px 0}
.tile{width:140px;height:80px;border-radius:12px;background:linear-gradient(var(--snow-a),var(--snow-b));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:18px}
.set{display:flex;align-items:center;gap:16px;width:375px;height:56px;padding:16px;border-bottom:1px solid var(--line);text-align:left;background:var(--paper)}
.set b{flex:1;font-weight:600;font-size:20px}
/* sheet + toast */
#sheet{position:absolute;inset:0;background:rgba(30,40,50,.35);display:none;align-items:flex-end;z-index:20}
#sheet.open{display:flex}
#sheet .panel{width:100%;max-height:78%;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:22px 20px 28px}
#sheet h2{margin:0 0 14px;font-size:22px}
.vrow{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #e4ebf1}
.field{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:16px var(--round);color:var(--earth)}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:var(--earth);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:320px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>

/* tone line chart: x 0..334, levels at y = 17 + (5-L)*50 */
const LX0 = 66, LX1 = 282;
const ly = L => 17 + (5-L)*50;
function contourPts(chao){ return chao.map((L,i)=>[LX0 + (LX1-LX0)*i/(chao.length-1), ly(L)]); }
function smoothPath(pts){
  if (pts.length===2) return `M${pts[0][0]} ${pts[0][1]} L${pts[1][0]} ${pts[1][1]}`;
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`; }
  return d;
}
function toneLines(x,y,chao,{dashed=false,id='tl'}={}){
  const labs=['So','Fa','Mi','Re','Do'];
  const pts = contourPts(chao), last=pts[pts.length-1], prev=pts[pts.length-2];
  const ang = Math.atan2(last[1]-prev[1], last[0]-prev[0]);
  const ah = (a)=>`${last[0]-9*Math.cos(ang+a)} ${last[1]-9*Math.sin(ang+a)}`;
  return `<svg class="tonelines" id="${id}" style="left:${x}px;top:${y}px" viewBox="0 0 334 272" aria-label="Pitch chart: So is high, Do is low">
  ${labs.map((l,i)=>`<text x="7" y="${ly(5-i)+5}" text-anchor="middle">${l}</text><text x="327" y="${ly(5-i)+5}" text-anchor="middle">${l}</text>`).join('')}
  ${[1,2,3,4,5].map(L=>`<line x1="46" x2="288" y1="${ly(L)}" y2="${ly(L)}" stroke="#45535A" stroke-opacity=".2"/>`).join('')}
  <path id="${id}-target" d="${smoothPath(pts)}" stroke="#4E616A" stroke-width="2" fill="none" stroke-linecap="round" ${dashed?'stroke-dasharray="6 6"':''}/>
  <path d="M${ah(.5)} L${last[0]} ${last[1]} L${ah(-.5)}" stroke="#4E616A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="${id}-user" d="" stroke="#2F9BFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
// moves a DOM bubble along the target contour, then optionally rests at the end
function runKnob(knob, svgId, tlX, tlY, ms=1100){
  const path = document.getElementById(svgId+'-target'); if(!path||!knob) return;
  const len = path.getTotalLength(), t0 = performance.now(), size = knob.offsetWidth;
  (function step(now){ const k=Math.min(1,(now-t0)/ms), p=path.getPointAtLength(len*k);
    knob.style.left=(tlX+p.x-size/2)+'px'; knob.style.top=(tlY+p.y-size/2)+'px';
    if(k<1) requestAnimationFrame(step); })(t0);
}
function placeKnobStart(knob, chao, tlX, tlY){ const p=contourPts(chao)[0], s=knob.offsetWidth; knob.style.left=(tlX+p[0]-s/2)+'px'; knob.style.top=(tlY+p[1]-s/2)+'px'; }

/* ---------- pitch detection (YIN-style, runs locally in the browser) ---------- */
const A = {ctx:null, stream:null, an:null, buf:null, raf:0, busy:false};
function stopMic(){ cancelAnimationFrame(A.raf); A.busy=false; if(A.stream){ A.stream.getTracks().forEach(t=>t.stop()); A.stream=null; } if(A.ctx){ A.ctx.close().catch(()=>{}); A.ctx=null; } }
function yin(buf, sr){
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/buf.length); if(rms<0.012) return -1;
  const N = buf.length>>1, minT = Math.floor(sr/500), maxT = Math.min(N-1, Math.floor(sr/70));
  const d = new Float32Array(maxT+2);
  for(let t=1;t<=maxT+1 && t<N;t++){ let s=0; for(let i=0;i<N;i++){ const x=buf[i]-buf[i+t]; s+=x*x; } d[t]=s; }
  let run=0; d[0]=1; for(let t=1;t<=maxT+1;t++){ run+=d[t]; d[t] = run ? d[t]*t/run : 1; }
  let tau=-1; for(let t=minT;t<=maxT;t++){ if(d[t]<0.15){ while(t+1<=maxT && d[t+1]<d[t]) t++; tau=t; break; } }
  if(tau<2) return -1;
  const x0=d[tau-1], x1=d[tau], x2=d[tau+1], den=x0+x2-2*x1;
  return sr / (den ? tau + (x0-x2)/(2*den) : tau);
}
async function record(){
  if (A.busy) return;
  const fb=$('#fb'), sub=$('#sub'), mic=$('#mic'), note=$('#micnote');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fb.textContent='No microphone here'; sub.textContent='This browser can’t use the microphone. Try Chrome or Safari.'; return; }
  try{
    speechSynthesis && speechSynthesis.cancel();
    A.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    fb.textContent='Microphone blocked';
    sub.textContent = e && e.name==='NotAllowedError' ? 'Allow microphone access for this page, then tap the mic again. If this view doesn’t offer that, open the downloaded file in Chrome or Safari.' : 'The microphone could not start here. Open the downloaded file in Chrome or Safari.';
    return;
  }
  A.busy=true; A.ctx = new (window.AudioContext||window.webkitAudioContext)();
  const src = A.ctx.createMediaStreamSource(A.stream); A.an = A.ctx.createAnalyser(); A.an.fftSize=2048; src.connect(A.an); A.buf=new Float32Array(2048);
  mic.classList.add('rec'); fb.textContent='Listening…'; note.textContent='Say the word now';
  const frames=[], t0=performance.now(); let voiced=false, lastV=0;
  const T = TONES[V.tone], mean = T.chao.reduce((a,b)=>a+b,0)/T.chao.length;
  const step = () => {
    A.an.getFloatTimeDomainData(A.buf); const now=performance.now(), f=yin(A.buf, A.ctx.sampleRate);
    frames.push({t:(now-t0)/1000, f});
    if (f>0){ voiced=true; lastV=now; drawUser(cleanContour(frames).st, mean); }
    if (now-t0>2400 || (voiced && now-lastV>420)) finish(); else A.raf=requestAnimationFrame(step);
  };
  const finish = () => { mic.classList.remove('rec'); stopMic(); note.textContent='Tap the mic to try again'; judge(frames); };
  A.raf=requestAnimationFrame(step);
}
function cleanContour(frames){
  // longest voiced run, allowing short gaps; semitones re 100 Hz; median-smoothed; octave-jump guarded
  let best=[], cur=[], gap=0;
  for(const fr of frames){ if(fr.f>0){ cur.push(fr); gap=0; } else if(cur.length){ gap++; if(gap>4){ if(cur.length>best.length) best=cur; cur=[]; gap=0; } } }
  if(cur.length>best.length) best=cur;
  let st = best.map(fr=>12*Math.log2(fr.f/100));
  for(let i=1;i<st.length;i++){ while(st[i]-st[i-1]>7) st[i]-=12; while(st[i-1]-st[i]>7) st[i]+=12; }
  st = st.map((_,i)=>{ const w=st.slice(Math.max(0,i-2),i+3).sort((a,b)=>a-b); return w[w.length>>1]; });
  const dur = best.length ? best[best.length-1].t - best[0].t : 0;
  return {st, dur};
}
function drawUser(st, targetMean){
  const p = $('#gt-user'); if(!p || st.length<2) return;
  const m = st.reduce((a,b)=>a+b,0)/st.length;
  const pts = st.map((s,i)=>[LX0+(LX1-LX0)*i/(st.length-1), ly(Math.max(.6,Math.min(5.4, targetMean+(s-m)/2.5)))]);
  p.setAttribute('d', 'M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L'));
}
function judge(frames){
  const fb=$('#fb'), sub=$('#sub'); if(!fb) return;
  const {st, dur} = cleanContour(frames);
  V.attempts++;
  if (st.length<6 || dur<0.12){ fb.textContent='One more time'; sub.textContent='I didn’t catch a clear voice. Speak a little louder, close to the mic.'; return; }
  const n=st.length, q=Math.max(1,Math.round(n*.25));
  const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  const s=avg(st.slice(0,q)), e=avg(st.slice(-q)), mn=Math.min(...st), mx=Math.max(...st), R=mx-mn, p=st.indexOf(mn)/(n-1);
  let ok=false, msg='';
  switch(V.tone){
    case 1: ok = R<=3 && Math.abs(e-s)<=2; msg = e-s>2 ? 'Keep it level, don’t rise' : s-e>2 ? 'Keep it high, don’t drop' : 'Hold one steady pitch'; break;
    case 2: ok = e-s>=2.5 && s-mn<=2.5; msg = e-s<2.5 ? 'Higher pitch :)' : 'Rise straight up, no dip first'; break;
    case 3: ok = s-mn>=1.5 && ((p>=.2 && p<=.9 && e-mn>=1) || p>.6); msg = 'Dip lower, then come up'; break;
    case 4: ok = s-e>=3.5 && mx-s<=2; msg = s-e<3.5 ? 'Start higher and drop further' : 'Start at the top, then fall'; break;
    case 5: ok = dur<=.45 && R<=4; msg = dur>.45 ? 'Shorter and lighter' : 'Keep it light, no big swing'; break;
  }
  if (ok){
    fb.textContent='Excellent!'; sub.textContent='Your pitch shape matches.';
    const k=$('#gknob'); if(k){ k.innerHTML=bubbleSVG(TONES[V.tone].color); k.style.width=k.style.height='60px'; runKnob(k,'gt',23,412,700); }
    setTimeout(()=>{ if(V.screen==='game') nextGameWord(true); }, 1500);
  } else {
    fb.textContent = V.attempts>=3 ? 'One more time' : msg;
    sub.textContent = V.attempts>=3 ? msg+'. Or tap → to skip this word.' : 'Blue is your voice; the dashed line is the target.';
  }
}

    <div id="msgs" aria-live="polite">
      ${log.length?'':`<div class="them">${avatar(t,26)}<p>你好！I’m ${t.name.split(' ')[0]}. Ask me anything about Mandarin tones.</p></div>`}
      ${log.map(m=>m.me?`<div class="me">${esc(m.text)}</div>`:`<div class="them">${avatar(t,26)}<p>${esc(m.text)}</p></div>`).join('')}
    </div>
    <form class="typebar" id="tb" onsubmit="return false">
      <span aria-hidden="true">${IC.img}</span><span aria-hidden="true">${IC.sticker}</span>
      <input id="msg" autocomplete="off" placeholder="${locked?'Earn a gem to ask a question':'Type a question'}" ${locked?'disabled':''} aria-label="Message">
      <button id="send" aria-label="Send" ${locked?'disabled':''}>${IC.send}</button>
    </form>
  </section>`;
  const box=$('#msgs'); box.scrollTop=box.scrollHeight;
  $('#cback').onclick = () => go('teachers');
  $('#send').onclick = () => sendMsg(t);
  $('#msg').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); sendMsg(t); } };
};
let samplerP = null;
function getSampler(){ if(!samplerP) samplerP = (window.claude && typeof window.claude.use==='function') ? window.claude.use('sample').catch(()=>null) : Promise.resolve(null); return samplerP; }
function cannedReply(text){
  const q=text.toLowerCase();
  if (/mamahuhu|馬馬虎虎|马马虎虎/.test(q)) return '馬馬虎虎 (mǎmǎhūhū) means “so-so” or “careless.” Literally “horse horse tiger tiger.” Say it: 3rd, 3rd, 1st, 1st. Two 3rd tones in a row: the first one rises like a 2nd tone, so it sounds like má mǎ hū hū.';
  if (/5th|neutral|fifth/.test(q)) return 'The neutral tone is short and light. It appears on particles like 嗎 ma and 呢 ne, and on the second syllable of words like 媽媽 māma. Don’t push it up or down, just let it fall off gently.';
  if (/accent|confiden/.test(q)) return 'Record yourself in the Game tab and compare your blue line with the dashed target. Small daily practice beats long sessions. You’re doing well!';
  return 'Good question! Try the word in Training, then check your pitch in the Game tab. Tell me which word feels hardest and we’ll practice it together.';
}
async function sendMsg(t){
  const inp=$('#msg'); const text=inp.value.trim(); if(!text) return;
  const log=S.chats[t.id]; log.push({me:true,text}); inp.value=''; save(); render();
  const box=$('#msgs'); const pend=document.createElement('div'); pend.className='them typing'; pend.innerHTML=`${avatar(t,26)}<p>…</p>`; box.appendChild(pend); box.scrollTop=box.scrollHeight;
  let reply = null;
  try{
    const sample = await getSampler();
    if (sample){
      const history = log.slice(-7,-1).map(m=>(m.me?'Student: ':'You: ')+m.text).join('\n');
      const prompt = `You are ${t.name}, a friendly Mandarin tutor in Taiwan, answering inside Tonify, a tone-learning app for teenage English language learners. Reply in 1 to 3 short sentences of plain English. When you use Chinese, write Traditional characters followed by pinyin with tone marks. No markdown.${history?'\n\nConversation so far:\n'+history:''}\n\nThe student now asks: ${text}`;
      const r = await sample(prompt, {modelTier:'quick', cache:false});
      reply = r && r.text ? r.text.trim() : null;
    }
  }catch(e){ reply = null; }
  if (!reply) reply = cannedReply(text);
  log.push({me:false,text:reply}); save();
  if (V.screen==='chat' && V.chat===t.id) render();
}

/* ---------- dashboard ---------- */
SCREENS.dash = () => {
  const done = Object.keys(S.trained).length + Object.keys(S.played).length; // 10 = 5 trainings + 5 games
  app.innerHTML = `<section class="scr" style="background:var(--paper)">
    <header class="hdr"><h1 class="abs h1" style="left:0;width:375px;top:48px;margin:0;color:var(--paper)">Happy learning${S.name?', '+esc(S.name):''}</h1></header>
    <div class="summary">
      <span class="ava" style="width:60px;height:60px;background:linear-gradient(#29CCFF,#2F9BFF);border:1.5px solid var(--peacock);font-size:22px">${esc((S.name||'You').slice(0,1).toUpperCase())}<span class="dot"></span></span>
      <div style="margin-top:16px;font-weight:500;font-size:18px">Total progress</div>
      <div style="position:relative;width:200px;height:20px;margin-top:8px">${progressBar(0,0,done)}</div>
      <div style="display:flex;gap:16px;margin-top:24px">
        <div class="tile"><span>Training</span><span>${Object.keys(S.trained).length===5?'🏆 Passed':`${Object.keys(S.trained).length} of 5`}</span></div>
        <div class="tile"><span>Gems</span><span>💎 × ${S.gems}</span></div>
      </div>
    </div>
    <div class="abs" style="left:0;top:422px">
      <button class="set" id="svoc">${IC.voc}<b>My vocabulary</b>${IC.right}</button>
      <button class="set" id="sset">${IC.setting}<b>Setting</b>${IC.right}</button>
      <button class="set" id="sbuy">${IC.buy}<b>Buy gem</b>${IC.right}</button>
      <button class="set" id="sout">${IC.logout}<b>Logout</b>${IC.right}</button>
    </div>
    ${menu('my')}
  </section>`;
  $('#svoc').onclick = openVocab; $('#sset').onclick = openSettings;
  $('#sbuy').onclick = () => toast('Gems are earned by passing trainings. There’s nothing to buy.');
  $('#sout').onclick = () => go('home');
  bindMenu();
};
function sheet(html){ const s=$('#sheet'); s.innerHTML=`<div class="panel">${html}</div>`; s.classList.add('open'); s.onclick=e=>{ if(e.target===s) closeSheet(); }; }
function closeSheet(){ const s=$('#sheet'); s.classList.remove('open'); s.innerHTML=''; }
function openVocab(){
  const all = Object.values(TONES).flatMap(T=>T.words);
  const list = S.fav.map(ch=>all.find(w=>w.ch===ch)).filter(Boolean);
  sheet(`<h2>My vocabulary</h2>${list.length?list.map(w=>`<div class="vrow"><span class="han" style="font-size:34px">${w.ch}</span><span style="flex:1"><b>${esc(w.py)}</b><br><span style="font-size:14px">${esc(w.en)}</span></span><button class="chip" data-say="${w.ch}" aria-label="Hear ${esc(w.py)}">${IC.sound}</button></div>`).join('')
    :'<p>Tap the heart on a word card to save it here.</p>'}<button class="pill sm" style="position:relative;margin:20px auto 0;display:flex" onclick="closeSheet()">Done</button>`);
  $('#sheet').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
}
function openSettings(){
  sheet(`<h2>Setting</h2><label style="display:block;margin-bottom:6px;font-weight:600">Your name</label>
    <input class="field" id="nm" value="${esc(S.name)}" maxlength="20" placeholder="e.g. Rick">
    <button class="pill sm" id="savenm" style="position:relative;margin:16px auto 0;display:flex">Save</button>
    <button id="reset" style="display:block;margin:22px auto 0;color:#C0392B;font-weight:600">Reset all progress</button>`);
  $('#savenm').onclick = () => { S.name=$('#nm').value.trim(); save(); closeSheet(); render(); };
  $('#reset').onclick = () => { if(confirm('Reset gems, progress, saved words and chats on this device?')){ S=structuredClone(DEF); save(); closeSheet(); go('home'); } };
}

function render(){ closeSheet(); (SCREENS[V.screen]||SCREENS.home)(); }
fit(); render();
</script>
